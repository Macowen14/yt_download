[project]
name = "yt-download"
version = "0.1.0"
description = "Feature-rich, resilient YouTube video and audio downloader CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.8.19",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "ytfetch.py",
    "main.py",
]

[project.scripts]
ytfetch = "ytfetch:main"
yt-download = "ytfetch:main"



